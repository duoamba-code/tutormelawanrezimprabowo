name: Build Kirin Voxel Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Build Fabric mod
        run: gradle --no-daemon --max-workers=2 clean build

      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: kirinvx-fabric-1.21.11
          path: build/libs/kirinvx-0.1.0.jar
          if-no-files-found: error
          retention-days: 7
